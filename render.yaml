services:
  - type: web
    name: ncdot-chatbot-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -m app.ingest
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://dathwik.github.io
